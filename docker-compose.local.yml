services:
  postgres:
    image: postgres:15.2-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: verceldb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d verceldb"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "127.0.0.1:5480:5432"
    volumes:
      - comfydeploy-postgres:/var/lib/postgresql/data

  pg_proxy:
    image: ghcr.io/neondatabase/wsproxy:latest
    environment:
      APPEND_PORT: "postgres:5432"
      ALLOW_ADDR_REGEX: ".*"
      LOG_TRAFFIC: "false"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:5481:80"

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    environment:
      MINIO_ROOT_USER: comfydeploy
      MINIO_ROOT_PASSWORD: comfydeploy-secret
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - comfydeploy-minio:/data

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 comfydeploy comfydeploy-secret; do
        echo 'Waiting for MinIO...';
        sleep 2;
      done;
      mc alias set local http://minio:9000 comfydeploy comfydeploy-secret &&
      mc mb --ignore-existing local/comfyui-deploy &&
      mc anonymous set download local/comfyui-deploy &&
      exit 0"

  web:
    image: oven/bun:1.1
    working_dir: /app
    env_file:
      - path: ./web/.env.local.docker
        required: false
    environment:
      POSTGRES_SSL: "false"
      POSTGRES_URL: ${POSTGRES_URL:-postgres://postgres:postgres@postgres:5432/verceldb}
      POSTGRES_WS_PROXY: ${POSTGRES_WS_PROXY:-pg_proxy:80/v1}
      LOCAL_AUTH_USER_ID: ${LOCAL_AUTH_USER_ID:-local-admin}
      LOCAL_AUTH_USER_NAME: ${LOCAL_AUTH_USER_NAME:-Local Admin}
      LOCAL_AUTH_ORG_ID: ${LOCAL_AUTH_ORG_ID:-}
      LOCAL_AUTH_ORG_NAME: ${LOCAL_AUTH_ORG_NAME:-Local}
      LOCAL_AUTH_PASSWORD: ${LOCAL_AUTH_PASSWORD:-}
      NEXT_PUBLIC_LOCAL_AUTH_USER_ID: ${NEXT_PUBLIC_LOCAL_AUTH_USER_ID:-local-admin}
      SPACES_ENDPOINT: ${SPACES_ENDPOINT:-http://minio:9000}
      SPACES_PUBLIC_ENDPOINT: ${SPACES_PUBLIC_ENDPOINT:-http://localhost:9000}
      SPACES_ENDPOINT_CDN: ${SPACES_ENDPOINT_CDN:-http://localhost:9000}
      SPACES_REGION: ${SPACES_REGION:-nyc3}
      SPACES_BUCKET: ${SPACES_BUCKET:-comfyui-deploy}
      SPACES_KEY: ${SPACES_KEY:-comfydeploy}
      SPACES_SECRET: ${SPACES_SECRET:-comfydeploy-secret}
      SPACES_CDN_DONT_INCLUDE_BUCKET: ${SPACES_CDN_DONT_INCLUDE_BUCKET:-false}
      SPACES_CDN_FORCE_PATH_STYLE: ${SPACES_CDN_FORCE_PATH_STYLE:-true}
      MODAL_BUILDER_URL: ${MODAL_BUILDER_URL:-}
      JWT_SECRET: ${JWT_SECRET:-local-development-change-me}
      PLAUSIBLE_DOMAIN: ${PLAUSIBLE_DOMAIN:-}
      NEXT_PUBLIC_POSTHOG_KEY: ${NEXT_PUBLIC_POSTHOG_KEY:-}
      NEXT_PUBLIC_POSTHOG_HOST: ${NEXT_PUBLIC_POSTHOG_HOST:-}
    command: >
      sh -lc "bun install &&
      SSL=false LOCAL=true bun run migrate.mts &&
      bun run dev --hostname 0.0.0.0"
    depends_on:
      postgres:
        condition: service_healthy
      pg_proxy:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./web:/app
      - comfydeploy-bun-cache:/root/.bun
      - comfydeploy-node-modules:/app/node_modules

volumes:
  comfydeploy-postgres:
  comfydeploy-minio:
  comfydeploy-bun-cache:
  comfydeploy-node-modules:
