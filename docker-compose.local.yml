services:
  postgres:
    image: postgres:15.2-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: verceldb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d verceldb"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "5480:5432"
    volumes:
      - comfydeploy-postgres:/var/lib/postgresql/data

  pg_proxy:
    image: ghcr.io/neondatabase/wsproxy:latest
    environment:
      APPEND_PORT: "postgres:5432"
      ALLOW_ADDR_REGEX: ".*"
      LOG_TRAFFIC: "false"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5481:80"

  localstack:
    image: localstack/localstack:latest
    environment:
      SERVICES: s3
      AWS_ACCESS_KEY_ID: xyz
      AWS_SECRET_ACCESS_KEY: aaa
      DEFAULT_REGION: nyc3
    ports:
      - "4566:4566"
    volumes:
      - ./web/aws:/etc/localstack/init/ready.d:ro
      - ./web/aws:/app/web/aws:ro
      - comfydeploy-localstack:/var/lib/localstack

  web:
    image: oven/bun:1.1
    working_dir: /app
    environment:
      POSTGRES_SSL: "false"
      POSTGRES_URL: ${POSTGRES_URL:-postgres://postgres:postgres@postgres:5432/verceldb}
      POSTGRES_WS_PROXY: ${POSTGRES_WS_PROXY:-pg_proxy:80/v1}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      SPACES_ENDPOINT: ${SPACES_ENDPOINT:-http://localstack:4566}
      SPACES_ENDPOINT_CDN: ${SPACES_ENDPOINT_CDN:-http://localhost:4566}
      SPACES_REGION: ${SPACES_REGION:-nyc3}
      SPACES_BUCKET: ${SPACES_BUCKET:-comfyui-deploy}
      SPACES_KEY: ${SPACES_KEY:-xyz}
      SPACES_SECRET: ${SPACES_SECRET:-aaa}
      SPACES_CDN_DONT_INCLUDE_BUCKET: ${SPACES_CDN_DONT_INCLUDE_BUCKET:-false}
      SPACES_CDN_FORCE_PATH_STYLE: ${SPACES_CDN_FORCE_PATH_STYLE:-true}
      MODAL_BUILDER_URL: ${MODAL_BUILDER_URL:-}
      JWT_SECRET: ${JWT_SECRET:-local-development-change-me}
      PLAUSIBLE_DOMAIN: ${PLAUSIBLE_DOMAIN:-}
      NEXT_PUBLIC_POSTHOG_KEY: ${NEXT_PUBLIC_POSTHOG_KEY:-}
      NEXT_PUBLIC_POSTHOG_HOST: ${NEXT_PUBLIC_POSTHOG_HOST:-}
    command: >
      sh -lc "bun install &&
      SSL=false LOCAL=true bun run migrate.mts &&
      bun run dev --hostname 0.0.0.0"
    depends_on:
      postgres:
        condition: service_healthy
      pg_proxy:
        condition: service_started
      localstack:
        condition: service_started
    ports:
      - "3000:3000"
    volumes:
      - ./web:/app
      - comfydeploy-bun-cache:/root/.bun
      - comfydeploy-node-modules:/app/node_modules

volumes:
  comfydeploy-postgres:
  comfydeploy-localstack:
  comfydeploy-bun-cache:
  comfydeploy-node-modules:
