name: Build local web image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "web/**"
      - "docker-compose.local.yml"
      - ".github/workflows/docker-web.yml"

permissions:
  contents: read
  packages: write

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./web
          file: ./web/Dockerfile.local
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/gentlemanhu/comfyui-deploy-web:latest
            ghcr.io/gentlemanhu/comfyui-deploy-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
