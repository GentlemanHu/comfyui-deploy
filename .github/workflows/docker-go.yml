name: Build Go backend image

on:
  workflow_dispatch:
  push:
    branches:
      - go-backend-static-ui
    paths:
      - "go-api/**"
      - "docker-compose.go.yml"
      - ".github/workflows/docker-go.yml"

permissions:
  contents: read
  packages: write

jobs:
  build-go:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./go-api
          file: ./go-api/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/gentlemanhu/comfyui-deploy-go:latest
            ghcr.io/gentlemanhu/comfyui-deploy-go:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
